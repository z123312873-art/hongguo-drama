# Hongguo Drama 3.3: three-platform release candidate; publication is coordinated separately.
name: Windows x64 release candidate
on:
  workflow_dispatch:
    inputs:
      skip_playback:
        description: Skip player playback when the required acceptance footage is unavailable
        type: boolean
        default: false
  push:
    branches: ['windows/**']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: media-cache
        with:
          path: ${{ runner.temp }}/media/artifacts
          key: windows-media-${{ hashFiles('scripts/build-ffmpeg-source-win.sh') }}
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 make pkg-config
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-source-win.sh "$RUNNER_TEMP/media" 4
      - uses: actions/upload-artifact@v4
        with:
          name: windows-media
          path: ${{ runner.temp }}/media/artifacts/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-media-errors
          path: ${{ runner.temp }}/media/logs/
  windows:
    needs: media
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run unit and platform checks
        run: npm test
      - name: Check Windows FFmpeg discovery
        run: node scripts/check-ffmpeg-resolution.cjs
      - uses: actions/download-artifact@v4
        with:
          name: windows-media
          path: media
      - uses: actions/cache/restore@v4
        id: app-cache
        with:
          path: |
            dist/win-unpacked
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          key: windows-update-v2-${{ hashFiles('package*.json', 'main.js', 'preload.js', 'index.html', 'vite.config.js', 'src/**', 'build/**', 'scripts/build-ffmpeg-source-win.sh') }}
      - shell: pwsh
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          Copy-Item media/bin/* build/ffmpeg/ -Force
          npm run build:portable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/cache/save@v4
        if: steps.app-cache.outputs.cache-hit != 'true'
        with:
          path: |
            dist/win-unpacked
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Verify portable, fresh NSIS install, reinstall and real 1.80 upgrade
        env:
          HONGGUO_SKIP_PLAYBACK: ${{ (startsWith(github.ref, 'refs/heads/windows/4.1-pre-') || startsWith(github.ref, 'refs/heads/windows/4.1-release-')) && 'true' || inputs.skip_playback || 'false' }}
        shell: pwsh
        run: |
          if ($env:HONGGUO_SKIP_PLAYBACK -eq 'true') {
            node scripts/check-windows-release.cjs --skip-playback
          } else {
            node scripts/check-windows-release.cjs
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-windows-installer.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/windows-release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version -replace '^(\d+\.\d+)\.0$', '$1'
          Copy-Item "dist/红果短剧-$version-便携版.exe" "dist/windows-release/hongguo-downloader-$version-win-x64.exe"
          Compress-Archive -LiteralPath "dist/windows-release/hongguo-downloader-$version-win-x64.exe" -DestinationPath "dist/windows-release/hongguo-downloader-$version-win-x64.zip"
          Copy-Item "dist/hongguo-downloader-$version-win-x64-setup.exe" dist/windows-release/
          Copy-Item dist/latest.yml dist/windows-release/
          Copy-Item dist/*.blockmap dist/windows-release/
          Copy-Item media/*corresponding-source.tar.gz dist/windows-release/
          git archive --format=zip --output="dist/windows-release/hongguo-downloader-$version-windows-source.zip" HEAD
          Get-FileHash dist/windows-release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding utf8 dist/windows-release/WINDOWS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          path: dist/windows-release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: dist/windows-verification/
  publish-pre:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/windows/4.1-pre-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          path: release
      - name: Publish the 4.1 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=installer-4.1-traditional-pre
          setup="release/hongguo-downloader-4.1-win-x64-setup.exe"
          portable="release/hongguo-downloader-4.1-win-x64.zip"
          test -f "$setup"
          test -f "$portable"
          setup_sha=$(sha256sum "$setup" | cut -d' ' -f1)
          portable_sha=$(sha256sum "$portable" | cut -d' ' -f1)
          notes=$(cat <<EOF
          預發佈，不會取代 4.0 正式版的自動更新。僅提供安裝版與便攜 ZIP，安裝檔未簽章。

          - 修正加密片源按方向鍵快進、快退 5 秒時重新播放的問題。
          - 搜尋結果的海報無法顯示時，改用相容的圖片版本，仍失敗才顯示佔位圖。
          - 熱播榜四個榜單的卡片，來源標示「新劇」時顯示綠色標籤（排名與評分之間）。
          - 末集播完時，劇名帶標點或查詢暫時失敗也能找到並自動播放下一季。

          SHA256
          - hongguo-downloader-4.1-win-x64-setup.exe: $setup_sha
          - hongguo-downloader-4.1-win-x64.zip: $portable_sha
          EOF
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease --notes "$notes"
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "4.1 預發佈" --notes "$notes"
          fi
          gh release upload "$tag" "$setup" "$portable" --clobber
          keep=$(printf '%s\n%s\n' "$(basename "$setup")" "$(basename "$portable")")
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release view "$tag" --json assets --jq '.assets[].name'
  publish-release:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/windows/4.1-release-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          path: release
      - name: Publish the 4.1 formal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v4.1
          setup="release/hongguo-downloader-4.1-win-x64-setup.exe"
          blockmap="$setup.blockmap"
          latest="release/latest.yml"
          portable="release/hongguo-downloader-4.1-win-x64.zip"
          for file in "$setup" "$blockmap" "$latest" "$portable"; do test -f "$file"; done
          grep -Fq "hongguo-downloader-4.1-win-x64-setup.exe" "$latest"
          grep -Eq '^version: 4\.1\.0$' "$latest"
          setup_sha=$(sha256sum "$setup" | cut -d' ' -f1)
          setup_size=$(stat -c %s "$setup")
          portable_sha=$(sha256sum "$portable" | cut -d' ' -f1)
          notes=$(cat <<EOF
          摘要：
          - 方向鍵快進、快退不再重新播放。
          - 搜尋海報顯示失敗時自動換圖。
          - 熱播榜新增綠色「新劇」標籤。
          - 有 AdGuard 時播放連線更穩。
          - 末集播完時，更穩定地找到並自動播放下一季。
          - 更新提醒視窗完整列出所有條目，條目多時可捲動，放不下的會標出還有幾條。
          - 播放設備註冊失敗後短暫等待即可再試，不必重開 App；改網路或代理設定會立即重試。
          - 信任系統憑證庫，AdGuard、防毒軟體過濾 HTTPS 時也能連線；被攔截時會提示加入例外。

          4.1 正式版，未簽章。已安裝的 4.0 會看到上面的摘要。下載與安裝都要自己確認。

          檔名：hongguo-downloader-4.1-win-x64-setup.exe
          SHA256：$setup_sha
          大小：$setup_size
          便攜 ZIP：hongguo-downloader-4.1-win-x64.zip
          便攜 ZIP SHA256：$portable_sha
          對應提交：$GITHUB_SHA
          EOF
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --draft=false --latest --title "4.1 正式版" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "4.1 正式版" --notes "$notes"
          fi
          gh release upload "$tag" "$setup" "$blockmap" "$latest" "$portable" --clobber
          keep=$(printf '%s\n' "$(basename "$setup")" "$(basename "$blockmap")" "latest.yml" "$(basename "$portable")")
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release view "$tag" --json isPrerelease,isDraft,assets --jq '{isPrerelease,isDraft,assets:[.assets[].name]}'
