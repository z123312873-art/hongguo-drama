# Hongguo Drama 3.3: three-platform release candidate; publication is coordinated separately.
name: Windows x64 release candidate
on:
  workflow_dispatch:
    inputs:
      skip_playback:
        description: Skip player playback when the required acceptance footage is unavailable
        type: boolean
        default: false
  push:
    branches: ['windows/**']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: media-cache
        with:
          path: ${{ runner.temp }}/media/artifacts
          key: windows-media-${{ hashFiles('scripts/build-ffmpeg-source-win.sh') }}
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 make pkg-config nasm
      - if: steps.media-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-source-win.sh "$RUNNER_TEMP/media" 4
      - uses: actions/upload-artifact@v7
        with:
          name: windows-media
          path: ${{ runner.temp }}/media/artifacts/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-media-errors
          path: ${{ runner.temp }}/media/logs/
  windows:
    needs: media
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run unit and platform checks
        run: npm test
      - name: Check Windows FFmpeg discovery
        run: node scripts/check-ffmpeg-resolution.cjs
      - uses: actions/download-artifact@v8
        with:
          name: windows-media
          path: media
      - uses: actions/cache/restore@v6
        id: app-cache
        with:
          path: |
            dist/win-unpacked
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          key: windows-update-v2-${{ hashFiles('package*.json', 'main.js', 'preload.js', 'index.html', 'vite.config.js', 'src/**', 'build/**', 'scripts/build-ffmpeg-source-win.sh') }}
      - shell: pwsh
        if: steps.app-cache.outputs.cache-hit != 'true'
        run: |
          Copy-Item media/bin/* build/ffmpeg/ -Force
          npm run build:portable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/cache/save@v6
        if: steps.app-cache.outputs.cache-hit != 'true'
        with:
          path: |
            dist/win-unpacked
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          key: ${{ steps.app-cache.outputs.cache-primary-key }}
      - name: Verify portable, fresh NSIS install, reinstall and real 1.80 upgrade
        env:
          HONGGUO_SKIP_PLAYBACK: ${{ (startsWith(github.ref, 'refs/heads/windows/4.5-pre-') || startsWith(github.ref, 'refs/heads/windows/4.3-release-') || startsWith(github.ref, 'refs/heads/windows/4.1-release-')) && 'true' || inputs.skip_playback || 'false' }}
        shell: pwsh
        run: |
          if ($env:HONGGUO_SKIP_PLAYBACK -eq 'true') {
            node scripts/check-windows-release.cjs --skip-playback
          } else {
            node scripts/check-windows-release.cjs
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/check-windows-installer.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/windows-release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version -replace '^(\d+\.\d+)\.0$', '$1'
          Copy-Item "dist/红果短剧-$version-便携版.exe" "dist/windows-release/hongguo-downloader-$version-win-x64.exe"
          Compress-Archive -LiteralPath "dist/windows-release/hongguo-downloader-$version-win-x64.exe" -DestinationPath "dist/windows-release/hongguo-downloader-$version-win-x64.zip"
          Copy-Item "dist/hongguo-downloader-$version-win-x64-setup.exe" dist/windows-release/
          Copy-Item dist/latest.yml dist/windows-release/
          Copy-Item dist/*.blockmap dist/windows-release/
          Copy-Item media/*corresponding-source.tar.gz dist/windows-release/
          git archive --format=zip --output="dist/windows-release/hongguo-downloader-$version-windows-source.zip" HEAD
          Get-FileHash dist/windows-release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding utf8 dist/windows-release/WINDOWS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-candidate
          path: dist/windows-release/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification
          path: dist/windows-verification/
  publish-release-4-3:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/windows/4.3-release-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release-candidate
          path: release
      - name: Publish the 4.3 formal release and retire the 4.2 and 4.3 pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v4.3
          setup="release/hongguo-downloader-4.3-win-x64-setup.exe"
          blockmap="$setup.blockmap"
          latest="release/latest.yml"
          portable="release/hongguo-downloader-4.3-win-x64.zip"
          for file in "$setup" "$blockmap" "$latest" "$portable"; do test -f "$file"; done
          grep -Fq "hongguo-downloader-4.3-win-x64-setup.exe" "$latest"
          grep -Eq '^version: 4\.3\.0$' "$latest"
          setup_sha=$(sha256sum "$setup" | cut -d' ' -f1)
          setup_size=$(stat -c %s "$setup")
          portable_sha=$(sha256sum "$portable" | cut -d' ' -f1)
          notes=$(cat <<EOF
          摘要：
          - 新增「漫畫」分類，最多 300 部，可挑漫畫、選集數閱讀，並記住讀到哪裡。
          - 漫畫圖片會提前載入，往下滑幾乎不用等；下一話也會先準備好。
          - 按「刷新片單」不再換掉畫面上的漫畫，點分集都能打開。
          - 漫畫圖片清晰度隨視窗大小調整，1K、2K、4K 螢幕都清楚。
          - 各分類首頁海報更多且數量一致，西飯、河馬首頁至少 40 部。
          - 剛開啟時海報出現得更快；西飯、河馬海報存在本機，切換來源立即顯示。
          - 在線播放更快更穩，切換集數幾乎不用等。
          - 漫畫閱讀頁底部按鈕在深色背景下清楚可見。

          4.3 正式版，未簽章。已安裝的 4.1 會看到上面的摘要。下載與安裝都要自己確認。

          檔名：hongguo-downloader-4.3-win-x64-setup.exe
          SHA256：$setup_sha
          大小：$setup_size
          便攜 ZIP：hongguo-downloader-4.3-win-x64.zip
          便攜 ZIP SHA256：$portable_sha
          對應提交：$GITHUB_SHA
          EOF
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --draft=false --latest --title "4.3 正式版" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "4.3 正式版" --notes "$notes"
          fi
          gh release upload "$tag" "$setup" "$blockmap" "$latest" "$portable" --clobber
          keep=$(printf '%s\n' "$(basename "$setup")" "$(basename "$blockmap")" "latest.yml" "$(basename "$portable")")
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release view "$tag" --json isPrerelease,isDraft,assets --jq '{isPrerelease,isDraft,assets:[.assets[].name]}'
          # The formal release is in place; only now are the pre-releases and their tags removed.
          for old in installer-4.2-traditional-pre installer-4.3-traditional-pre; do
            if gh release view "$old" > /dev/null 2>&1; then
              gh release delete "$old" --cleanup-tag --yes
            fi
          done
          gh release list --limit 20
  publish-release-4-5-pre:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/windows/4.5-pre-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the release candidate
        id: candidate
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: windows-release-candidate
          path: release
      - name: Retry the release candidate download once
        if: steps.candidate.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: windows-release-candidate
          path: release
      - name: Publish the 4.5 pre-release without replacing the formal latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=installer-4.5-traditional-pre
          setup="release/hongguo-downloader-4.5-win-x64-setup.exe"
          blockmap="$setup.blockmap"
          latest="release/latest.yml"
          portable="release/hongguo-downloader-4.5-win-x64.zip"
          for file in "$setup" "$blockmap" "$latest" "$portable"; do test -f "$file"; done
          grep -Fq "hongguo-downloader-4.5-win-x64-setup.exe" "$latest"
          grep -Eq '^version: 4\.5\.0$' "$latest"
          setup_sha=$(sha256sum "$setup" | cut -d' ' -f1)
          setup_size=$(stat -c %s "$setup")
          portable_sha=$(sha256sum "$portable" | cut -d' ' -f1)
          notes=$(cat <<EOF
          摘要：
          - 新增「搶先上線日」顯示即將上線解鎖短劇，請多加利用
          - 修正首次播放卡頓問題
          - 修正來源格式不同時，優化在線播放等待
          - 優化線路不穩時，自動接入備用線路
          - 首次安裝程式時，預設改為繁體中文
          - 優化線上播放異常問題

          4.5 預發佈，未簽章。4.3 仍是正式版。下載與安裝都要自己確認。

          檔名：hongguo-downloader-4.5-win-x64-setup.exe
          SHA256：$setup_sha
          大小：$setup_size
          便攜 ZIP：hongguo-downloader-4.5-win-x64.zip
          便攜 ZIP SHA256：$portable_sha
          對應提交：$GITHUB_SHA
          EOF
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease=true --latest=false --title "4.5 預發佈" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "4.5 預發佈" --notes "$notes"
          fi
          gh release upload "$tag" "$setup" "$blockmap" "$latest" "$portable" --clobber
          keep=$(printf '%s\n' "$(basename "$setup")" "$(basename "$blockmap")" "latest.yml" "$(basename "$portable")")
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release view "$tag" --json isPrerelease,isDraft --jq '{isPrerelease,isDraft}'
          test "$(gh release view "$tag" --json isPrerelease,isDraft --jq '(.isPrerelease == true) and (.isDraft == false)')" = "true"
          test "$(gh release view --json tagName --jq .tagName)" != "$tag"
          if gh release view installer-4.4-traditional-pre > /dev/null 2>&1; then
            gh release delete installer-4.4-traditional-pre --cleanup-tag --yes
          fi
  publish-release:
    needs: windows
    if: startsWith(github.ref, 'refs/heads/windows/4.1-release-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release-candidate
          path: release
      - name: Publish the 4.1 formal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v4.1
          setup="release/hongguo-downloader-4.1-win-x64-setup.exe"
          blockmap="$setup.blockmap"
          latest="release/latest.yml"
          portable="release/hongguo-downloader-4.1-win-x64.zip"
          for file in "$setup" "$blockmap" "$latest" "$portable"; do test -f "$file"; done
          grep -Fq "hongguo-downloader-4.1-win-x64-setup.exe" "$latest"
          grep -Eq '^version: 4\.1\.0$' "$latest"
          setup_sha=$(sha256sum "$setup" | cut -d' ' -f1)
          setup_size=$(stat -c %s "$setup")
          portable_sha=$(sha256sum "$portable" | cut -d' ' -f1)
          notes=$(cat <<EOF
          摘要：
          - 方向鍵快進、快退不再重新播放。
          - 搜尋海報顯示失敗時自動換圖。
          - 熱播榜新增綠色「新劇」標籤。
          - 有 AdGuard 時播放連線更穩。
          - 末集播完時，更穩定地找到並自動播放下一季。
          - 更新提醒視窗完整列出所有條目，條目多時可捲動，放不下的會標出還有幾條。
          - 播放設備註冊失敗後短暫等待即可再試，不必重開 App；改網路或代理設定會立即重試。
          - 信任系統憑證庫，AdGuard、防毒軟體過濾 HTTPS 時也能連線；被攔截時會提示加入例外。

          4.1 正式版，未簽章。已安裝的 4.0 會看到上面的摘要。下載與安裝都要自己確認。

          檔名：hongguo-downloader-4.1-win-x64-setup.exe
          SHA256：$setup_sha
          大小：$setup_size
          便攜 ZIP：hongguo-downloader-4.1-win-x64.zip
          便攜 ZIP SHA256：$portable_sha
          對應提交：$GITHUB_SHA
          EOF
          )
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --prerelease=false --draft=false --latest --title "4.1 正式版" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "4.1 正式版" --notes "$notes"
          fi
          gh release upload "$tag" "$setup" "$blockmap" "$latest" "$portable" --clobber
          keep=$(printf '%s\n' "$(basename "$setup")" "$(basename "$blockmap")" "latest.yml" "$(basename "$portable")")
          gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if ! printf '%s\n' "$keep" | grep -Fxq -- "$name"; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
          gh release view "$tag" --json isPrerelease,isDraft,assets --jq '{isPrerelease,isDraft,assets:[.assets[].name]}'
